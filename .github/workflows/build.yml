name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS builds run on release tags (see release.yml) and on manual
        # dispatch (see macos-app below) to conserve Actions minutes; per-push
        # CI validates Linux + Windows cross-compilation.
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Download sidecar
        shell: bash
        run: ./scripts/download-sidecar.sh --target "${{ matrix.target }}"

      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Tauri app
        run: npm run tauri build -- --target "${{ matrix.target }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bundle-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  # Manual-only Apple Silicon build for smoke-testing a branch on a real Mac.
  # Run it from the Actions tab (or `gh workflow run build.yml --ref <branch>`)
  # and download the zipped .app from the run's artifacts. The `if` keeps it
  # off push and pull_request, so the per-push cost stays Linux + Windows.
  macos-app:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    env:
      TARGET: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Download sidecar
        shell: bash
        run: ./scripts/download-sidecar.sh --target "$TARGET"

      - name: Build Tauri app
        run: npm run tauri build -- --target "$TARGET" --bundles app

      # ditto keeps the bundle's symlinks and extended attributes, which a
      # plain zip of the directory would break (and with them the ad-hoc
      # signature).
      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent \
            "src-tauri/target/$TARGET/release/bundle/macos/Immich Shuttle.app" \
            "$RUNNER_TEMP/immich-shuttle-$TARGET.app.zip"

      - name: Upload app
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          # Artifact names cannot contain "/", so key on the commit, not the branch.
          name: immich-shuttle-aarch64-apple-darwin-app-${{ github.sha }}
          path: ${{ runner.temp }}/immich-shuttle-aarch64-apple-darwin.app.zip
          if-no-files-found: error

  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Download sidecar
        shell: bash
        run: ./scripts/download-sidecar.sh --target x86_64-unknown-linux-gnu

      - name: Svelte type-check
        run: npm run check

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run e2e
