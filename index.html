<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Immich Shuttle</title>
    <script>
      // Apply the stored theme + dark palette before first paint so a
      // dark-mode launch never flashes light chrome or the wrong palette
      // (theme.ts takes over once the app boots).
      (function () {
        try {
          var mode = localStorage.getItem("immich-shuttle-theme");
          var dark =
            mode === "dark" ||
            (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          var palette = localStorage.getItem("immich-shuttle-palette");
          if (palette !== "indigo" && palette !== "ember") palette = "darkroom";
          if (palette !== "indigo") document.documentElement.classList.add("palette-" + palette);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
